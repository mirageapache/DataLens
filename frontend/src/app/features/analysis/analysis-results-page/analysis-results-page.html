<div class="max-w-6xl mx-auto space-y-6 pt-4">
  <!-- Top Bar -->
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <button (click)="location.back()" class="text-gray-500 hover:text-matPrimary flex items-center space-x-1 text-sm transition">
        <i class="fa-solid fa-arrow-left"></i>
        <span>返回上一頁</span>
      </button>
      <span class="text-gray-300">/</span>
      <span class="text-xs font-mono bg-gray-200 text-gray-700 px-2 py-0.5 rounded">Task ID: task_{{ taskId }}</span>
    </div>
    <button (click)="deleteTask()" class="text-red-500 hover:text-red-700 font-medium text-sm px-3 py-1.5 rounded hover:bg-red-50 transition flex items-center space-x-1 border border-transparent hover:border-red-100">
      <i class="fa-regular fa-trash-can"></i>
      <span>刪除報告</span>
    </button>
  </div>

  @if (taskId) {
    <app-analysis-block [taskId]="taskId"></app-analysis-block>
  }
</div>

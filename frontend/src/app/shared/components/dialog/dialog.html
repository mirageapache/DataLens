@if (dialogService.currentDialog(); as dialog) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 transition-opacity duration-300"
       [ngClass]="dialogService.isClosing() ? 'opacity-0' : 'opacity-100'">
    <!-- Dialog Content -->
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform transition-all duration-300"
         [ngClass]="dialogService.isClosing() ? 'scale-95 opacity-0' : 'scale-100 opacity-100'">
      
      <!-- Icon Container -->
      <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4" [ngClass]="getIconBgClass(dialog.type)">
        <i class="text-4xl" [ngClass]="getIconClass(dialog.type)"></i>
      </div>
      
      <!-- Text -->
      <h3 class="text-2xl font-bold text-gray-800 mb-2">{{ dialog.title }}</h3>
      <p class="text-matTextSecondary mb-6">{{ dialog.message }}</p>
      
      <!-- Actions -->
      <div class="flex justify-center gap-3">
        @if (dialog.showCancel) {
          <button (click)="dialogService.cancel()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition shadow-sm">
            取消
          </button>
        }
        <button (click)="dialogService.confirm()" class="px-5 py-2.5 text-white rounded-lg font-medium transition shadow-sm" [ngClass]="getConfirmBtnClass(dialog.type)">
          確定
        </button>
      </div>
    </div>
  </div>
}

<!-- ================= App Shell: Toolbar ================= -->
<header class="bg-matPrimary text-white h-16 flex items-center justify-between px-4 mat-elevation-2 z-10 sticky top-0">
  <div class="flex items-center space-x-4">
    <button (click)="toggleMobileMenu()" class="lg:hidden text-white hover:bg-white/10 w-10 h-10 rounded-full flex items-center justify-center transition">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-chart-pie text-xl text-indigo-200"></i>
      <span class="text-xl font-medium tracking-wide">DataLens</span>
    </div>
  </div>
  
  <div class="flex items-center space-x-3">
    <!-- 頂部全域 CTA 按鈕 -->
    <button routerLink="/datasets" class="bg-white text-matPrimary hover:bg-indigo-50 font-medium px-4 py-2 rounded shadow flex items-center space-x-2 text-sm transition">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <span>上傳資料</span>
    </button>
    <!-- 設定選單按鈕 -->
    <button class="text-white hover:bg-white/10 w-10 h-10 rounded-full flex items-center justify-center transition">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
</header>

<!-- ================= App Shell: Sidenav Container ================= -->
<div class="flex overflow-hidden h-[calc(100vh-64px)]">
  
  <!-- Mobile Backdrop -->
  <div *ngIf="isMobileMenuOpen" (click)="toggleMobileMenu()" class="fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

  <!-- Left SideNav (mat-sidenav) -->
  <aside 
    [ngClass]="isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'"
    class="w-60 bg-matSurface border-r border-matBorder flex flex-col justify-between py-2 shrink-0 fixed inset-y-0 left-0 lg:relative lg:inset-auto z-40 h-full transition-transform duration-300 lg:translate-x-0">
    <nav class="space-y-1 px-2">
      <a routerLink="/datasets" routerLinkActive="bg-indigo-50 text-matPrimary font-medium" [routerLinkActiveOptions]="{exact: true}" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-matTextSecondary hover:bg-gray-100 font-medium text-sm transition">
        <i class="fa-solid fa-folder-closed text-base" [class.text-matPrimary]="router.url === '/datasets'"></i>
        <span [class.text-matPrimary]="router.url === '/datasets'">資料集</span>
      </a>
      <a routerLink="/analysis/history" routerLinkActive="bg-indigo-50 text-matPrimary font-medium" [routerLinkActiveOptions]="{exact: false}" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-matTextSecondary hover:bg-gray-100 font-medium text-sm transition">
        <i class="fa-solid fa-chart-column text-base" [class.text-matPrimary]="router.url.includes('/analysis')"></i>
        <span [class.text-matPrimary]="router.url.includes('/analysis')">分析歷史</span>
      </a>
    </nav>

    <div class="border-t border-matBorder pt-2 px-2 space-y-1">
      <div class="px-4 py-1 text-xs font-semibold text-gray-400 tracking-wider">外部服務</div>
      <a href="http://localhost:3000" target="_blank" class="flex items-center justify-between px-4 py-2.5 rounded-lg text-matTextSecondary hover:bg-gray-100 font-medium text-sm transition">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-gauge-high text-base"></i>
          <span>監控</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-400"></i>
      </a>
      <a href="http://localhost:8000/docs" target="_blank" class="flex items-center justify-between px-4 py-2.5 rounded-lg text-matTextSecondary hover:bg-gray-100 font-medium text-sm transition">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-code text-base"></i>
          <span>API 文件</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-400"></i>
      </a>
    </div>
  </aside>

  <!-- Main Content Area (router-outlet) -->
  <main class="flex-1 overflow-y-auto p-6">
    <router-outlet></router-outlet>
  </main>
</div>

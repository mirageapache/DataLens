services:
  fastapi-app:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # 熱重載：改 code 立即生效
      - /app/.venv            # ponytail: 用容器內的 venv，別被 host 的 Windows .venv 蓋掉
      - uploads:/app/uploads  # 與 celery-worker 共用（worker Phase 2 再加）
    environment:
      # 預設值作為 fallback 保險，應與 .env.example 保持一致
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-datalens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      # 預設值作為 fallback 保險，應與 .env.example 保持一致
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-datalens}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # ponytail: 不對 host 開 port——app/worker 都走 compose 內網 redis:6379，
    # host 目前沒東西連 redis（且 6379 已被別的專案容器佔用）。
    # 要用 GUI 從本機連時再加：ports: ["6381:6379"]（挑沒被佔的 port）。

volumes:
  uploads:
  pgdata:
